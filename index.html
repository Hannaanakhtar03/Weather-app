<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1721574182554-1e881da0a044?q=80&w=2127&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            width: 300px;
            color: #fff;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        input {
            padding: 10px;
            width: 70%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            margin-bottom: 15px;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        button {
            padding: 10px 20px;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
            margin: 10px 0;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        .weather-info {
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            color: #fff;
        }
        .weather-info h3 {
            margin: 5px 0;
            font-size: 22px;
        }
        .weather-info h2 {
            margin: 10px 0;
            font-size: 36px;
            color: #FFD700;
        }
        .weather-info p {
            margin: 8px 0;
        }
        .clear {
            background: rgba(255, 69, 58, 0.7);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .clear:hover {
            background: rgba(255, 69, 58, 1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Weather App</h2>
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
        <div class="weather-info" id="weather-info">
            <h3 id="city-name"></h3>
            <h2 id="temperature">°C</h2>
            <p id="weather-description"></p>
            <p>Humidity: <span id="humidity"></span>%</p>
            <p>Wind Speed: <span id="wind-speed"></span> m/s</p>
            <p>Feels Like: <span id="feels-like"></span>°C</p>
            <button class="clear">Clear</button>
        </div>
    </div>

    <script>
        const clearBtn = document.querySelector('.clear')
        clearBtn.addEventListener('click', clear)

        function clear(){
            document.getElementById("weather-info").style.display = "none";
        }

        function getWeather() {
            const city = document.getElementById("city").value;
            const apiKey = "a769d12d2548bb27dfe0cbf4309d99c2";
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
            fetch(url)
                .then(response => response.json())
                .then(data=> {
                        if(data.cod===404){
                            alert("City not found. Please try again.");
                        }  
                        else{
                            document.getElementById("weather-info").style.display = "block";
                            document.getElementById("city-name").innerText = data.name;
                            document.getElementById("temperature").innerText = data.main.temp + "°C";
                            document.getElementById("weather-description").innerText = data.weather[0].description;
                            document.getElementById("humidity").innerText = data.main.humidity;
                            document.getElementById("wind-speed").innerText = data.wind.speed;
                            document.getElementById("feels-like").innerText = data.main.feels_like;
                        }
            })
        }
    </script>
</body>
</html>
